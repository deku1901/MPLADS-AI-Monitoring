services:
  # -------------------------------------------------------------------------
  # 1. MPLADS AI Backend Service (FastAPI + Python 3.11)
  # -------------------------------------------------------------------------
  - type: web
    name: mplads-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_ACCELERATION_FACTOR
        value: "3600"
      - key: ENVIRONMENT
        value: production

  # -------------------------------------------------------------------------
  # 2. MPLADS AI Frontend (Next.js 16)
  # -------------------------------------------------------------------------
  - type: web
    name: mplads-ai-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: mplads-ai-backend
          property: host
